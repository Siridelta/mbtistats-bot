[project]
name = "nonebot-plugin-mbtistats"
version = "0.1.0"
description = "NoneBot2 plugin for MBTI group statistics"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Siridelta" }
]
keywords = ["nonebot", "nonebot2", "mbti", "plugin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "nonebot2>=2.4.0",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-adapter-onebot>=2.4.0",
    "playwright>=1.56.0",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
qq-adapter = ["nonebot-adapter-qq>=1.6.0"]

[project.entry-points."nonebot.plugins"]
mbtistats = "nonebot_plugin_mbtistats"

[project.urls]
Homepage = "https://github.com/Siridelta/nonebot-plugin-mbtistats"
Repository = "https://github.com/Siridelta/nonebot-plugin-mbtistats"
Issues = "https://github.com/Siridelta/nonebot-plugin-mbtistats/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nonebot_plugin_mbtistats"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
